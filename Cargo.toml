[workspace]
members = ["crates/deccp-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/zkFMI/zkfmi-crypto.git", rev = "26ebfe96563a05c3379219f7fdacea137ab5fb4f" }
deccp-core = { path = "crates/deccp-core" }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
serde_json = "1.0.145"

[patch."https://github.com/zkFMI/deccp.git"]
deccp-core = { path = "crates/deccp-core" }
